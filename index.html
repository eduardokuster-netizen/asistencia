<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#ECEFF3;--paper:#FFFFFF;--ink:#14213D;--muted:#5E6B80;--line:#D5DBE3;
  --ok:#1E7F52;--late:#B7791F;--bad:#B8322A;--accent:#2B4C8C;--pend:#8A94A6;
  --okbg:#E3F2EA;--latebg:#FBF0DC;--badbg:#F8E3E1;--pendbg:#EEF1F5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524;--paper:#172036;--ink:#E6EBF3;--muted:#98A3B8;--line:#2A3550;
  --ok:#3CB37A;--late:#E0A63A;--bad:#E0605A;--accent:#7FA2E8;--pend:#7A849A;
  --okbg:#15372A;--latebg:#3A2E14;--badbg:#3D1D1C;--pendbg:#1F2940;}}
:root[data-theme="dark"]{
  --bg:#0E1524;--paper:#172036;--ink:#E6EBF3;--muted:#98A3B8;--line:#2A3550;
  --ok:#3CB37A;--late:#E0A63A;--bad:#E0605A;--accent:#7FA2E8;--pend:#7A849A;
  --okbg:#15372A;--latebg:#3A2E14;--badbg:#3D1D1C;--pendbg:#1F2940;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
header h1{font:600 20px/1.2 "Barlow Semi Condensed",sans-serif;margin:0}
header .who{font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto}
nav button{flex:1;border:0;background:none;color:var(--muted);font:600 15px "Barlow",sans-serif;padding:9px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack>*+*{margin-top:14px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
/* Reloj */
.clock{text-align:center;padding:10px 0 4px}
.clock .t{font:700 clamp(64px,20vw,112px)/1 "Barlow Semi Condensed",sans-serif;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.clock .d{color:var(--muted);font-size:16px;margin-top:4px;text-transform:capitalize}
.stamp{display:block;margin:22px auto 8px;width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;
  background:var(--ink);color:var(--paper);font:700 22px/1.15 "Barlow Semi Condensed",sans-serif;
  box-shadow:0 0 0 8px var(--paper),0 0 0 10px var(--line)}
.stamp.out{background:var(--accent)}
.stamp:active{transform:scale(.97)}
.stamp:disabled{opacity:.45;cursor:default}
.msg{text-align:center;min-height:24px;font-weight:600;padding:10px 12px;border-radius:10px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{color:var(--muted)}
.today{text-align:center;font-size:15px;color:var(--muted)}
/* Estado */
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-ok{background:var(--okbg);color:var(--ok)}.s-late{background:var(--latebg);color:var(--late)}
.s-absent{background:var(--badbg);color:var(--bad)}.s-pending,.s-off,.s-future{background:var(--pendbg);color:var(--pend)}
.s-extra{background:var(--okbg);color:var(--ok)}
.s-leave{background:var(--pendbg);color:var(--accent)}.s-flex{background:var(--pendbg);color:var(--pend)}
.counts .c-leave b{color:var(--accent)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.counts div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.counts b{display:block;font:700 28px/1 "Barlow Semi Condensed",sans-serif}
.counts span{font-size:13px;color:var(--muted)}
.counts .c-ok b{color:var(--ok)}.counts .c-late b{color:var(--late)}.counts .c-absent b{color:var(--bad)}.counts .c-pending b{color:var(--pend)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar .nav2{display:flex;align-items:center;gap:6px}
.bar .nav2 button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px}
.bar .lbl{font-weight:600;min-width:150px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 11px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .nm{font-weight:600}.list .sub{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--paper)}
td .dot{display:inline-block;min-width:44px;padding:2px 4px;border-radius:6px;font-weight:600;font-size:13px}
.sched{display:grid;grid-template-columns:minmax(80px,auto) 1fr 1fr 1fr;gap:6px 8px;align-items:center}
.sched .day{display:flex;align-items:center;gap:6px;font-size:15px}
.sched input[type=checkbox]{width:20px;height:20px}
.sched input[type=time],.sched select{padding:8px 6px;font-size:14px}
footer{text-align:center;margin-top:18px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
td[data-ed]{cursor:pointer}
.stats{margin-top:6px}
.stats h3{font:600 17px "Barlow Semi Condensed",sans-serif;margin:0 0 8px;text-align:center}
.counts.c3{grid-template-columns:repeat(3,1fr)}
.greet{text-align:center}.greet b{display:block;font:700 26px/1.1 "Barlow Semi Condensed",sans-serif}.greet span{color:var(--muted);font-size:14px}
.big{width:100%;padding:14px 16px;font-size:17px}
.sec{font:600 15px "Barlow Semi Condensed",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.ver{display:block;margin-top:10px;font-size:11px;color:var(--muted);opacity:.8}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="biz">Control de asistencia</h1><span class="who" id="who"></span></header>
  <nav id="tabs"></nav>
  <main id="main"><div class="empty">Cargando…</div></main>
  <footer id="foot"></footer>
</div>
<script>
/* ====== CONFIGURACIÓN DE TU PROYECTO FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDPYnk9FHf9N4fmkRZZBVywo35STY6MS-c",
  authDomain: "control-asis.firebaseapp.com",
  projectId: "control-asis",
  storageBucket: "control-asis.firebasestorage.app",
  messagingSenderId: "573447532024",
  appId: "1:573447532024:web:ed9e2cfcc59ae996af3a0d"
};
/* =================================================== */
const VERSION="V1.08";
// Mensaje de error con la causa real (permiso, conexión, etc.)
function errTxt(err,base){const c=err&&err.code||"";
  if(c.includes("permission-denied"))return base+" Firebase lo rechazó por permisos: revisa que tu UID (al pie de la página) esté en las reglas de Firestore y que las reglas estén publicadas.";
  if(c.includes("unavailable"))return base+" No hay conexión con Firebase. Revisa tu internet.";
  return base+(err&&err.message?" Detalle: "+err.message:"");}
const DAYS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ORDER=[1,2,3,4,5,6,0];
const S={db:null,owner:false,cfg:null,docs:{},devices:{},requests:{},leaves:{},myLeaves:{},myDev:undefined,myReq:undefined,
  tab:"marcar",view:"dia",date:null,week:null,company:null,editing:null,recEdit:null,compEdit:null,emode:"home",
  ready:false,noDb:false,subMonths:"",unsub:null,adminUnsubs:[],mineUnsubs:[]};
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return key(d)};
const monday=k=>{const d=fromKey(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return key(d)};
const hm24=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}; // para campos y comparaciones
const t12=str=>{if(!str)return"";const[h,m]=str.split(":").map(Number);return(h%12||12)+":"+pad(m)+" "+(h<12?"AM":"PM")};
const hm=ts=>t12(hm24(ts)); // para mostrar en pantalla (12 horas)
const toMin=s=>{const[h,m]=(s||"0:0").split(":").map(Number);return h*60+m};
const minOf=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes()};
const hmin=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtLong=k=>fromKey(k).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=k=>fromKey(k).toLocaleDateString("es",{day:"numeric",month:"short"});
const $=id=>document.getElementById(id);
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const model=()=>{const ua=navigator.userAgent;return/iPhone/.test(ua)?"iPhone":/Android/.test(ua)?"Android":/Windows/.test(ua)?"Windows":/Mac/.test(ua)?"Mac":"Otro"};
S.date=key(new Date());S.week=monday(S.date);
const qStart=k=>k.slice(0,8)+(+k.slice(8)<=15?"01":"16");
const mEnd=k=>{let d=k.slice(0,8)+"28";while(addDays(d,1).slice(0,7)===k.slice(0,7))d=addDays(d,1);return d};
S.q=qStart(S.date);S.m=S.date.slice(0,8)+"01";
function rangeKeys(a,b){const ks=[];let k=a;while(k<=b){ks.push(k);k=addDays(k,1)}return ks}
function periodDays(){
  if(S.view==="semana")return rangeKeys(S.week,addDays(S.week,6));
  if(S.view==="quincena")return rangeKeys(S.q,S.q.endsWith("-01")?S.q.slice(0,8)+"15":mEnd(S.q));
  if(S.view==="mes")return rangeKeys(S.m,mEnd(S.m));
  return[S.date];
}
function shiftPeriod(dir){
  if(S.view==="dia")S.date=addDays(S.date,dir);
  else if(S.view==="semana")S.week=addDays(S.week,7*dir);
  else if(S.view==="quincena"){const d=periodDays();S.q=qStart(dir<0?addDays(S.q,-1):addDays(d[d.length-1],1))}
  else S.m=(dir<0?addDays(S.m,-1):addDays(mEnd(S.m),1)).slice(0,8)+"01";
}
function periodLabel(){
  if(S.view==="dia")return fmtLong(S.date);
  if(S.view==="mes"){const t=fromKey(S.m).toLocaleDateString("es",{month:"long",year:"numeric"});return t.charAt(0).toUpperCase()+t.slice(1)}
  const d=periodDays();return fmtShort(d[0])+" – "+fmtShort(d[d.length-1]);
}
try{S.company=localStorage.getItem("asis_company")}catch(e){}

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function geoErr(e){if(e&&e.code===1)return"Permiso de ubicación denegado. Actívalo para este sitio en tu navegador y vuelve a intentar.";if(e&&e.code===3)return"La ubicación tardó demasiado. Intenta de nuevo, idealmente cerca de una puerta o ventana.";return"No se pudo obtener tu ubicación en este dispositivo."}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:0});let done=false;const t=setTimeout(()=>{if(!done){done=true;rej({code:3})}},25000);
  navigator.geolocation.getCurrentPosition(p=>{if(!done){done=true;clearTimeout(t);res(p)}},e=>{if(!done){done=true;clearTimeout(t);rej(e)}},{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}

/* ---------- Localizador (GPS + red a la vez) ---------- */
const GEO={last:null,ids:[],listeners:new Set()};
function geoStart(){
  if(GEO.ids.length||!navigator.geolocation)return;
  const on=p=>{const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    if(!GEO.last||f.acc<=GEO.last.acc||Date.now()-GEO.last.t>15000)GEO.last=f;GEO.listeners.forEach(fn=>fn(f))};
  const err=e=>{GEO.listeners.forEach(fn=>fn(null,e));if(e&&e.code===1)geoStop()};
  GEO.ids.push(navigator.geolocation.watchPosition(on,err,{enableHighAccuracy:true,maximumAge:10000,timeout:60000}));
  GEO.ids.push(navigator.geolocation.watchPosition(on,err,{enableHighAccuracy:false,maximumAge:30000,timeout:60000}));
}
function geoStop(){if(navigator.geolocation)GEO.ids.forEach(id=>navigator.geolocation.clearWatch(id));GEO.ids=[]}
function geoPrewarm(){
  if(!navigator.permissions||!navigator.permissions.query)return;
  navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted"&&S.tab==="marcar"&&!document.hidden)geoStart()}).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)geoStop();else if(S.tab==="marcar")geoPrewarm()});
// Verifica que esté dentro de alguna de las empresas de la lista
function checkLoc(list){return new Promise((res,rej)=>{
  const t0=Date.now();let best=null,done=false;
  const judge=f=>{let c=null,d=Infinity;for(const x of list){const dd=dist(f.lat,f.lng,x.lat,x.lng);if(dd<d){d=dd;c=x}}
    const acc=f.acc;const maxAcc=Math.max(150,c.radius);
    if(!best||acc<best.acc)best={d,acc,c};
    if((d<=c.radius&&acc<=maxAcc)||d+acc<=c.radius)return finish(res,{d,acc,c});
    if(acc<=50&&d-acc>c.radius)finish(rej,new Error(`Estás a ${Math.round(d)} m de ${c.name}. Debes estar a menos de ${c.radius} m.`));
  };
  const onFix=(f,e)=>{if(e){if(e.code===1)finish(rej,new Error(geoErr(e)));return}judge(f)};
  const iv=setInterval(()=>{const sec=Math.round((Date.now()-t0)/1000);
    msg(best?`Buscando tu ubicación (${sec} s). Precisión actual: ±${Math.round(best.acc)} m.`:`Buscando tu ubicación (${sec} s)…`,"info")},1000);
  const timer=setTimeout(()=>{
    if(!best)finish(rej,new Error("No se obtuvo señal de ubicación. Revisa que la ubicación esté activada, acércate a una puerta o ventana y vuelve a intentar."));
    else if(best.acc>Math.max(150,best.c.radius))finish(rej,new Error(`La señal sigue imprecisa (±${Math.round(best.acc)} m). Acércate a una puerta o ventana y vuelve a intentar.`));
    else finish(rej,new Error(`Estás a ${Math.round(best.d)} m de ${best.c.name}. Debes estar a menos de ${best.c.radius} m.`));
  },30000);
  function finish(fn,v){if(done)return;done=true;clearTimeout(timer);clearInterval(iv);GEO.listeners.delete(onFix);fn(v)}
  msg("Buscando tu ubicación…","info");
  GEO.listeners.add(onFix);geoStart();
  if(GEO.last&&Date.now()-GEO.last.t<30000)judge(GEO.last);
})}

/* ---------- Datos ---------- */
function norm(raw){ // convierte la versión anterior (una sola empresa) al formato multiempresa
  const c=raw?JSON.parse(JSON.stringify(raw)):{};c.companies=c.companies||[];c.employees=c.employees||[];
  if(!c.companies.length&&c.lat!=null)c.companies.push({id:"c1",name:c.bizName||"Mi empresa",lat:c.lat,lng:c.lng,radius:c.radius||100,tolerance:c.tolerance??10});
  const def=c.companies[0]&&c.companies[0].id;
  c.employees.forEach(e=>{if(!e.companyId&&def)e.companyId=def;if(e.first==null){const p=(e.name||"").trim().split(/\s+/);e.first=p[0]||"";e.last=p.slice(1).join(" ")}});
  delete c.bizName;delete c.lat;delete c.lng;delete c.radius;delete c.tolerance;return c;
}
const cfg=()=>S.cfg||{companies:[],employees:[]};
const comps=()=>cfg().companies||[];
const compById=id=>comps().find(c=>c.id===id);
const compOf=e=>compById(e.companyId);
const fullName=e=>((e.first||"")+" "+(e.last||"")).trim()||e.name||"";
const emps=(all,cid)=>(cfg().employees||[]).filter(e=>(all||e.active!==false)&&(!cid||e.companyId===cid)).sort((a,b)=>fullName(a).localeCompare(fullName(b)));
const rec=(id,k)=>{const d=S.docs[id+"_"+k.slice(0,7)];return d&&d.days?d.days[k]:null};
const defSched=()=>{const s={};for(let i=0;i<7;i++)s[i]={on:i>=1&&i<=5,start:"08:00",end:"17:00"};return s};
async function saveCfg(c){await S.db.doc("cfg/main").set(c);S.cfg=c}
function ensureCompany(){if(!compById(S.company)){S.company=comps()[0]?comps()[0].id:null}}
function localDev(){try{return JSON.parse(localStorage.getItem("asis_device")||"null")}catch(e){return null}}
function setLocalDev(v){try{localStorage.setItem("asis_device",JSON.stringify(v));return localStorage.getItem("asis_device")!==null}catch(e){return false}}

function leaveOf(empId,k,all){ // permiso aprobado (o cualquiera si all) de ese empleado ese día
  let best=null;for(const m of [S.leaves,S.myLeaves])for(const id in m){const l=m[id];if(l.empId===empId&&l.date===k&&(all||l.status==="approved")&&(!best||l.createdAt>best.createdAt))best={...l,id}}return best}
function status(e,k){
  const sch=(e.schedule||{})[fromKey(k).getDay()]||{on:false};const tol=(compOf(e)||{}).tolerance||0;
  const r=rec(e.id,k);const today=key(new Date());const lv=leaveOf(e.id,k);
  if(k>today&&!(lv&&lv.type==="absence"))return{k:"future",t:"—",r};
  if(e.since&&k<e.since&&!(r&&r.in))return{k:"future",t:"—",r};
  if(!sch.on)return r&&r.in?{k:"extra",t:"Día libre, marcó",r}:{k:"off",t:"Libre",r};
  const start=lv&&lv.type==="late"&&lv.until>sch.start?lv.until:sch.start;const perm=start!==sch.start;
  if(r&&r.in){const late=minOf(r.in)-toMin(start);return late>tol?{k:"late",t:"Tarde "+late+" min"+(perm?" (con permiso hasta "+t12(start)+")":""),r,late}:{k:"ok",t:perm?"A tiempo (permiso)":"A tiempo",r}}
  if(lv&&lv.type==="absence")return{k:"leave",t:"Permiso",r};
  if(sch.quota)return{k:"flex",t:"Opcional",r};
  const past=k<today||(new Date().getHours()*60+new Date().getMinutes())>toMin(start)+tol;
  return past?{k:"absent",t:"No ha llegado",r}:{k:"pending",t:perm?"Permiso hasta "+t12(start):"Entra "+t12(start),r};
}
// Días con cuota mensual (ej. 2 sábados al mes): cuántos trabajó y cuántos ya no puede cumplir
function quotaInfo(e,mp){
  const out=[];const today=key(new Date());const sc=e.schedule||{};
  for(const i of ORDER){const sch=sc[i];if(!sch||!sch.on||!sch.quota)continue;
    let k=mp+"-01",dates=[];while(k.slice(0,7)===mp){if(fromKey(k).getDay()===i&&(!e.since||k>=e.since))dates.push(k);k=addDays(k,1)}
    let worked=0,remaining=0;for(const d of dates){const r=rec(e.id,d);const lv=leaveOf(e.id,d);if(r&&r.in)worked++;else if(lv&&lv.type==="absence")worked++;else if(d>=today)remaining++}
    const need=Math.min(sch.quota,dates.length);if(need)out.push({dow:i,quota:need,worked,missed:Math.max(0,need-worked-remaining)})}
  return out;
}
const quotaTxt=q=>q.map(x=>`${DAYS[x.dow].slice(0,3)} ${Math.min(x.worked,x.quota)}/${x.quota} este mes`).join(" · ");
function extraMin(e,k,r){if(!r||!r.in||!r.out)return 0;const sch=(e.schedule||{})[fromKey(k).getDay()];
  if(!sch||!sch.on)return Math.round((r.out-r.in)/60000);return Math.max(0,minOf(r.out)-toMin(sch.end))}
function sumRange(e,keys){let late=0,lateMin=0,abs=0,work=0,extra=0,days=0;
  for(const k of keys){const s=status(e,k);if(s.k==="late"){late++;lateMin+=s.late}if(s.k==="absent")abs++;
    if(s.r&&s.r.in)days++;if(s.r&&s.r.in&&s.r.out)work+=Math.round((s.r.out-s.r.in)/60000);extra+=extraMin(e,k,s.r)}
  return{late,lateMin,abs,work,extra,days}}
function monthKeys(){const t=key(new Date());const ks=[];let k=t.slice(0,8)+"01";while(k<=t){ks.push(k);k=addDays(k,1)}return ks}
function tsOf(k,h){const d=fromKey(k);const[a,b]=h.split(":").map(Number);d.setHours(a,b,0,0);return d.getTime()}
function msg(t,cls){const m=$("msg");if(m){m.textContent=t;m.className="msg "+cls}}

/* ---------- Suscripciones ---------- */
function ensureSub(){
  const ms=new Set([S.date.slice(0,7),key(new Date()).slice(0,7),...periodDays().map(k=>k.slice(0,7))]);
  const sig=[...ms].sort().join(",");if(sig===S.subMonths||!S.db)return;S.subMonths=sig;
  if(S.unsub)S.unsub();
  S.unsub=S.db.collection("punches").where("month","in",[...ms]).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.docs=o;S.punchLoaded=true;refresh()},()=>{});
}
function subMine(){ // el documento del celular y la solicitud de este dispositivo
  S.mineUnsubs.forEach(u=>u());S.mineUnsubs=[];const L=localDev();
  if(!L){S.myDev=null;S.myReq=null;return}
  S.myDev=undefined;S.myReq=undefined;
  S.mineUnsubs.push(S.db.doc("devices/"+L.empId).onSnapshot(s=>{S.myDev=s.exists?s.data():null;refresh()},()=>{S.myDev=null;refresh()}));
  S.mineUnsubs.push(S.db.doc("requests/"+L.empId).onSnapshot(s=>{S.myReq=s.exists?s.data():null;refresh()},()=>{S.myReq=null;refresh()}));
  S.mineUnsubs.push(S.db.collection("leaves").where("empId","==",L.empId).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.myLeaves=o;refresh()},()=>{}));
}
function subAdmin(on){
  S.adminUnsubs.forEach(u=>u());S.adminUnsubs=[];S.devices={};S.requests={};S.leaves={};if(!on)return;
  S.adminUnsubs.push(S.db.collection("leaves").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.leaves=o;refresh()},()=>{}));
  S.adminUnsubs.push(S.db.collection("devices").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.devices=o;refresh()},()=>{}));
  S.adminUnsubs.push(S.db.collection("requests").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.requests=o;refresh()},()=>{}));
}

/* ---------- Pantalla del empleado ---------- */
async function myState(){
  const L=localDev();if(!L)return{k:"none"};
  if(S.myDev===undefined||S.myReq===undefined)return{k:"loading"};
  const e=(cfg().employees||[]).find(x=>x.id===L.empId);const h=await sha(L.empId+":"+L.token);
  const req=S.myReq&&S.myReq.deviceHash===h;
  if(e){const d=S.myDev;
    if(d&&d.hash===h){if(!d.approved)return{k:"devpending",e};if(e.active===false)return{k:"inactive",e};
      const c=compOf(e);if(!c||c.lat==null)return{k:"nocomp",e};return{k:"ok",e}}
    if(req)return{k:"reqpending"};
    return{k:"none",note:"Este celular ya no está vinculado a tu usuario. Si cambiaste de celular o el administrador lo reinició, vuelve a vincularlo."}}
  if(req)return{k:"reqpending"};
  return{k:"none",note:"Tu solicitud de registro no fue aprobada o fue eliminada. Puedes enviarla de nuevo o hablar con el administrador."};
}
let mKey="";
function info(t){$("main").innerHTML=`<div class="panel stack">${clockHTML}<div class="msg info">${t}</div></div>`;tick()}
async function rMarcar(){
  if(S.emode==="register")return rRegister();if(S.emode==="relink")return rRelink();if(S.emode==="leave")return rLeaveForm();
  const st=await myState();if(S.tab!=="marcar"||S.emode!=="home")return;mKey=st.k+(st.e?st.e.id:"");
  if(st.k==="loading")return info("Cargando…");
  if(st.k==="reqpending")return info("Tu registro fue enviado. Cuando el administrador lo apruebe, desde este celular podrás marcar tu asistencia.");
  if(st.k==="devpending")return info("Tu cambio de celular está pendiente. Cuando el administrador lo apruebe podrás marcar desde este celular.");
  if(st.k==="inactive")return info("Tu usuario está inactivo. Habla con el administrador.");
  if(st.k==="nocomp")return info("Tu empresa todavía no tiene la ubicación configurada. Habla con el administrador.");
  if(st.k==="none"){
    $("main").innerHTML=`<div class="panel stack">${clockHTML}${st.note?`<div class="msg bad">${st.note}</div>`:""}
      <p style="text-align:center;margin:8px 0">Para marcar tu asistencia, primero registra este celular. Debes estar en tu lugar de trabajo.</p>
      <button class="btn big" id="go-reg">Soy nuevo: registrarme</button>
      <button class="btn ghost big" id="go-rel">Ya estoy registrado y cambié de celular</button></div>`;
    tick();$("go-reg").onclick=()=>{S.emode="register";render()};$("go-rel").onclick=()=>{S.emode="relink";render()};return;
  }
  const e=st.e,c=compOf(e);
  $("main").innerHTML=`<div class="panel stack">

    ${clockHTML}
    <div class="today" id="tdy"></div>
    <button class="stamp" id="stamp">Marcar entrada</button>
    <div class="msg info" id="msg" role="status">Debes estar dentro del negocio para marcar.</div>
    <div class="stats" id="stats"></div>
    <div id="myleaves"></div>
    ${e.allowLeave!==false?'<button class="btn ghost big" id="goleave">Solicitar permiso</button>':""}</div>`;
  if($("goleave"))$("goleave").onclick=()=>{S.emode="leave";render()};
  $("stamp").onclick=punch;tick();updHome(e);geoPrewarm();
}
async function updMarcar(){
  if(S.emode!=="home")return;const st=await myState();
  if(st.k+(st.e?st.e.id:"")!==mKey||(st.k==="ok"&&!$("stamp")))return rMarcar();
  if(st.k==="ok")updHome(st.e);
}
function updHome(e){
  const k=key(new Date());const r=rec(e.id,k);const b=$("stamp");if(!b)return;
  const set=(t,label,cls,dis)=>{$("tdy").textContent=t;b.textContent=label;b.className=cls;b.disabled=dis||busy};
  if(!S.punchLoaded){set("Cargando tus marcas…","Cargando…","stamp",true);return}
  const sch=(e.schedule||{})[new Date().getDay()];const lv=leaveOf(e.id,k);
  let hor=sch&&sch.on?`Horario de hoy: ${t12(sch.start)} a ${t12(sch.end)}`:"Hoy es tu día libre";
  if(sch&&sch.on&&sch.quota)hor=`Hoy es ${DAYS[new Date().getDay()].toLowerCase()} opcional: debes trabajar ${sch.quota} al mes`;
  if(lv)hor+=lv.type==="absence"?". Tienes permiso para faltar hoy":`. Tienes permiso para llegar hasta las ${t12(lv.until)}`;
  if(!r||!r.in)set(hor,"Marcar entrada","stamp",false);
  else if(!r.out)set(`Entrada marcada a las ${hm(r.in)}. ${hor}`,"Marcar salida","stamp out",false);
  else set(`Entrada ${hm(r.in)}, salida ${hm(r.out)}`,"Jornada completa","stamp",true);
  const m=sumRange(e,monthKeys());const mes=new Date().toLocaleDateString("es",{month:"long"});
  const q=quotaInfo(e,k.slice(0,7));const faltas=m.abs+q.reduce((a,x)=>a+x.missed,0);
  const notes=[q.length?q.map(x=>`${DAYS[x.dow]}s trabajados: ${Math.min(x.worked,x.quota)} de ${x.quota}`).join(" · "):"",m.lateMin?`Minutos de tardanza acumulados: ${m.lateMin}`:""].filter(Boolean).join(" · ");
  $("stats").innerHTML=`<h3>Tu mes de ${mes}</h3><div class="counts c3"><div class="c-ok"><b>${m.days}</b><span>Días trabajados</span></div><div class="c-late"><b>${m.late}</b><span>Tardanzas</span></div><div class="c-absent"><b>${faltas}</b><span>Faltas</span></div></div>
    ${notes?`<p class="hint" style="text-align:center">${notes}</p>`:""}`;
  const mine=Object.entries(S.myLeaves).map(([id,l])=>({id,...l})).filter(l=>l.date>=addDays(k,-30)).sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  const lb={pending:["s-late","Pendiente"],approved:["s-ok","Aprobado"],rejected:["s-absent","Rechazado"]};
  if($("myleaves"))$("myleaves").innerHTML=mine.length?`<div class="sec">Mis permisos</div><ul class="list">${mine.map(l=>`<li><div><div class="nm" style="text-transform:capitalize">${fmtLong(l.date)}</div><div class="sub">${l.type==="absence"?"Faltar el día":"Llegar a las "+t12(l.until)}${l.reason?" · "+esc(l.reason):""}</div></div><span class="pill ${lb[l.status][0]}">${lb[l.status][1]}</span></li>`).join("")}</ul>`:"";
}
let busy=false;
async function punch(){
  if(busy)return;busy=true;let e=null;
  try{
    const st=await myState();if(st.k!=="ok"){busy=false;return rMarcar()}
    e=st.e;$("stamp").disabled=true;msg("Revisando tus marcas de hoy…","info");
    const k=key(new Date());const mk=k.slice(0,7);const ref=S.db.doc(`punches/${e.id}_${mk}`);
    // La decisión entrada/salida se toma con lo que está guardado en el servidor, no con lo que muestra la pantalla
    let snap;try{snap=await ref.get({source:"server"})}catch(_){throw new Error("No hay conexión. Revisa tu internet y vuelve a intentar.")}
    const r=snap.exists?((snap.data().days||{})[k]||null):null;
    const kind=!r||!r.in?"in":!r.out?"out":null;
    if(!kind){msg("Ya marcaste entrada y salida hoy.","info");return}
    if(kind==="out"&&!confirm(`Tu entrada fue a las ${hm(r.in)}. ¿Marcar tu salida ahora?`)){msg("Salida no marcada.","info");return}
    const {d,acc}=await checkLoc([compOf(e)]);
    const now=Date.now();const entry={[kind]:now,[kind+"Dist"]:Math.round(d),[kind+"Acc"]:Math.round(acc)};
    if(!snap.exists)await ref.set({empId:e.id,month:mk,days:{[k]:entry}});
    else{const upd={};for(const f in entry)upd[`days.${k}.${f}`]=entry[f];await ref.update(upd)}
    msg(kind==="in"?`Entrada registrada a las ${hm(now)}.`:`Salida registrada a las ${hm(now)}.`,"ok");
  }catch(err){msg(err.message||"No se pudo registrar. Intenta de nuevo.","bad")}
  finally{busy=false;if(e)updHome(e)}
}
function rRegister(){
  $("main").innerHTML=`<div class="panel stack"><strong>Registro de empleado</strong>
    <div class="row"><div><label for="g-first">Nombre</label><input id="g-first" autocomplete="given-name"></div><div><label for="g-last">Apellido</label><input id="g-last" autocomplete="family-name"></div></div>
    <div class="row"><div><label for="g-pin">Crea tu clave</label><input id="g-pin" type="password" inputmode="numeric" maxlength="6" placeholder="4 a 6 números"></div><div><label for="g-pin2">Repite la clave</label><input id="g-pin2" type="password" inputmode="numeric" maxlength="6"></div></div>
    <p class="hint">Este celular quedará como tu dispositivo para marcar. Debes estar en tu lugar de trabajo para enviar el registro.</p>
    <div class="msg info" id="msg"></div>
    <div class="row"><button class="btn ghost" id="g-back">Volver</button><button class="btn" id="g-go">Enviar registro</button></div></div>`;
  $("g-back").onclick=()=>{S.emode="home";render()};
  $("g-go").onclick=async()=>{
    if(busy)return;const first=$("g-first").value.trim(),last=$("g-last").value.trim(),pin=$("g-pin").value.trim();
    if(!first||!last)return msg("Escribe tu nombre y tu apellido.","bad");
    if(!/^\d{4,6}$/.test(pin))return msg("La clave debe tener de 4 a 6 números.","bad");
    if(pin!==$("g-pin2").value.trim())return msg("Las claves no coinciden.","bad");
    const list=comps().filter(c=>c.lat!=null);if(!list.length)return msg("El administrador todavía no ha configurado las empresas.","bad");
    busy=true;$("g-go").disabled=true;
    try{
      await checkLoc(list);
      const id=newId("e");const token=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,"0")).join("");
      if(!setLocalDev({empId:id,token}))throw new Error("Este navegador no permite guardar datos (¿modo incógnito?). Ábrelo en modo normal.");
      await S.db.doc("requests/"+id).set({first,last,pinHash:await sha(id+":"+pin),deviceHash:await sha(id+":"+token),model:model(),createdAt:Date.now()});
      S.emode="home";subMine();render();
    }catch(err){msg(err.message||"No se pudo enviar el registro. Intenta de nuevo.","bad");$("g-go").disabled=false}
    finally{busy=false}
  };
}
function rRelink(){
  const list=emps();
  $("main").innerHTML=`<div class="panel stack"><strong>Vincular este celular</strong>
    <div><label for="v-emp">Tu nombre</label><select id="v-emp"><option value="">Selecciona tu nombre</option>${list.map(e=>`<option value="${e.id}">${esc(fullName(e))}</option>`).join("")}</select></div>
    <div><label for="v-pin">Tu clave</label><input id="v-pin" type="password" inputmode="numeric" maxlength="6"></div>
    <p class="hint">El administrador tendrá que aprobar el cambio antes de que puedas marcar desde este celular.</p>
    <div class="msg info" id="msg"></div>
    <div class="row"><button class="btn ghost" id="v-back">Volver</button><button class="btn" id="v-go">Vincular</button></div></div>`;
  $("v-back").onclick=()=>{S.emode="home";render()};
  $("v-go").onclick=async()=>{
    if(busy)return;const e=list.find(x=>x.id===$("v-emp").value);const pin=$("v-pin").value.trim();
    if(!e)return msg("Selecciona tu nombre.","bad");
    if(await sha(e.id+":"+pin)!==e.pinHash)return msg("Clave incorrecta.","bad");
    const c=compOf(e);if(!c||c.lat==null)return msg("Tu empresa no tiene ubicación configurada. Habla con el administrador.","bad");
    busy=true;$("v-go").disabled=true;
    try{
      const ex=await S.db.doc("devices/"+e.id).get();
      if(ex.exists)throw new Error(ex.data().approved?"Ya hay un celular aprobado a tu nombre. Pide al administrador que lo reinicie primero.":"Ya hay un cambio de celular pendiente a tu nombre. Pide al administrador que lo revise.");
      await checkLoc([c]);
      const token=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,"0")).join("");
      if(!setLocalDev({empId:e.id,token}))throw new Error("Este navegador no permite guardar datos (¿modo incógnito?). Ábrelo en modo normal.");
      await S.db.doc("devices/"+e.id).set({hash:await sha(e.id+":"+token),approved:false,createdAt:Date.now(),model:model()});
      S.emode="home";subMine();render();
    }catch(err){msg(err.message||"No se pudo vincular. Intenta de nuevo.","bad");$("v-go").disabled=false}
    finally{busy=false}
  };
}

function rLeaveForm(){
  const t=key(new Date());
  $("main").innerHTML=`<div class="panel stack"><strong>Solicitar permiso</strong>
    <div><label for="p-type">Tipo de permiso</label><select id="p-type"><option value="absence">Faltar el día completo</option><option value="late">Llegar más tarde</option></select></div>
    <div class="row"><div><label for="p-date">Fecha</label><input id="p-date" type="date" min="${t}" value="${t}"></div><div id="p-untilw" style="display:none"><label for="p-until">Llegaría a las</label><input id="p-until" type="time" value="10:00"></div></div>
    <div><label for="p-reason">Motivo</label><input id="p-reason" maxlength="120" placeholder="Ej. cita médica, diligencia personal"></div>
    <div class="msg info" id="msg"></div>
    <div class="row"><button class="btn ghost" id="p-back">Volver</button><button class="btn" id="p-go">Enviar solicitud</button></div></div>`;
  $("p-type").onchange=()=>{$("p-untilw").style.display=$("p-type").value==="late"?"block":"none"};
  $("p-back").onclick=()=>{S.emode="home";render()};
  $("p-go").onclick=async()=>{
    const st=await myState();if(st.k!=="ok"||st.e.allowLeave===false){S.emode="home";return render()}
    const type=$("p-type").value,date=$("p-date").value,until=$("p-until").value,reason=$("p-reason").value.trim();
    if(!date||date<t)return msg("Elige una fecha de hoy en adelante.","bad");
    if(type==="late"&&!until)return msg("Indica a qué hora llegarías.","bad");
    if(!reason)return msg("Escribe el motivo.","bad");
    const ex=leaveOf(st.e.id,date,true);if(ex&&ex.status!=="rejected")return msg("Ya tienes una solicitud para ese día.","bad");
    $("p-go").disabled=true;
    try{const d={empId:st.e.id,date,month:date.slice(0,7),type,reason,status:"pending",createdAt:Date.now()};if(type==="late")d.until=until;
      await S.db.collection("leaves").doc(newId("p")).set(d);S.emode="home";render()}
    catch(err){$("p-go").disabled=false;msg("No se pudo enviar. Intenta de nuevo.","bad")}
  };
}

function pendBanner(){const n=pendingCount();return n?`<div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${n===1?"1 solicitud espera":n+" solicitudes esperan"} tu aprobación.</span><button class="btn" id="goemp">Revisar</button></div>`:""}
function bindBanner(){if($("goemp"))$("goemp").onclick=()=>{S.tab="empleados";render()}}
function rPanel(){
  ensureSub();if(S.recEdit)return rRecEdit();
  if(!comps().length){$("main").innerHTML=pendBanner()+`<div class="panel empty">Crea tu primera empresa para empezar.<br><br><button class="btn" id="gocomp">Ir a Empresas</button></div>`;bindBanner();$("gocomp").onclick=()=>{S.tab="empresas";render()};return}
  const list=emps(false,S.company);
  const head=`<div class="bar"><div class="seg"><button data-v="dia" aria-pressed="${S.view==="dia"}">Día</button><button data-v="semana" aria-pressed="${S.view==="semana"}">Semana</button><button data-v="quincena" aria-pressed="${S.view==="quincena"}">Quincena</button><button data-v="mes" aria-pressed="${S.view==="mes"}">Mes</button></div>

  else if(S.view==="dia"){
    const st=list.map(e=>({e,s:status(e,S.date)}));const cnt=k=>st.filter(x=>x.s.k===k).length;
    const order={absent:0,late:1,pending:2,leave:3,ok:4,extra:5,flex:6,off:7,future:8};st.sort((a,b)=>order[a.s.k]-order[b.s.k]);
    body=`<div class="counts"><div class="c-ok"><b>${cnt("ok")+cnt("late")+cnt("extra")}</b><span>Llegaron</span></div><div class="c-late"><b>${cnt("late")}</b><span>Tarde</span></div><div class="c-absent"><b>${cnt("absent")}</b><span>No llegaron</span></div><div class="c-pending"><b>${cnt("pending")}</b><span>Por llegar</span></div><div class="c-leave"><b>${cnt("leave")}</b><span>Con permiso</span></div></div>
    <div class="panel"><ul class="list">${st.map(({e,s})=>{const r=s.r;const t=r&&(r.in||r.out)?(r.in?`Entrada ${hm(r.in)}`+(r.inDist!=null?` (${r.inDist} m)`:""):"Sin entrada")+(r.out?` · Salida ${hm(r.out)}`:"")+(r.manual?" · Manual":""):"Sin marcas";const lvp=leaveOf(e.id,S.date);const qt=quotaTxt(quotaInfo(e,S.date.slice(0,7)));
      const extra=[lvp?(lvp.type==="absence"?"Permiso por el día":"Permiso hasta "+t12(lvp.until))+(lvp.reason?": "+esc(lvp.reason):""):"",qt].filter(Boolean).join(" · ");
      return`<li><div><div class="nm">${esc(fullName(e))}</div><div class="sub">${t}</div>${extra?`<div class="sub">${extra}</div>`:""}</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="pill s-${s.k}">${s.t}</span><button class="btn ghost" data-ed="${e.id}" data-k="${S.date}">${r?"Editar":"Agregar"}</button></div></li>`}).join("")}</ul></div>`;
  }else{
    const days=periodDays();const mp=days[0].slice(0,7);
    body=`<div class="panel scroll"><table><thead><tr><th>Empleado</th>${days.map(k=>`<th>${DAYS[fromKey(k).getDay()].slice(0,3)} ${fromKey(k).getDate()}</th>`).join("")}<th>Tarde</th><th>Faltas</th><th>Horas</th><th>Extra</th></tr></thead><tbody>
    ${list.map(e=>{const m=sumRange(e,days);const qi=quotaInfo(e,mp);const miss=S.view==="mes"?qi.reduce((a,x)=>a+x.missed,0):0;const cells=days.map(k=>{const s=status(e,k);
      const txt=s.r&&s.r.in?`${hm(s.r.in)}<br><span style="opacity:.7">${s.r.out?hm(s.r.out):"--:--"}</span>`:s.k==="absent"?"Falta":s.k==="off"?"Libre":s.k==="leave"?"Permiso":s.k==="flex"?"Opc.":"—";return`<td data-ed="${e.id}" data-k="${k}" title="Toca para editar"><span class="dot s-${s.k}">${txt}</span></td>`}).join("");
      const qt=quotaTxt(qi);return`<tr><td>${esc(fullName(e))}${qt?`<div class="sub" style="font-size:12px;color:var(--muted)">${qt}</div>`:""}</td>${cells}<td>${m.late}</td><td>${m.abs+miss}</td><td>${hmin(m.work)}</td><td>${hmin(m.extra)}</td></tr>`}).join("")}
    </tbody></table><p class="hint">En cada día, arriba la hora de entrada y abajo la de salida; toca una celda para editar ese día. Las horas suman solo los días con entrada y salida. Horas extra: tiempo después de la hora de salida, o el día completo si era día libre. "Opc." es un día con cuota mensual (por ejemplo, 2 sábados al mes).</p></div>`;
  }
  $("main").innerHTML=pendBanner()+compBar()+head+body;
  bindBanner();bindComp(rPanel);
  $("main").querySelectorAll("[data-ed]").forEach(el=>el.onclick=()=>{S.recEdit={id:el.dataset.ed,k:el.dataset.k};rPanel()});
  $("main").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;rPanel()});
  $("prev").onclick=()=>{shiftPeriod(-1);rPanel()};
  $("next").onclick=()=>{shiftPeriod(1);rPanel()};
}
function rRecEdit(){
  const {id,k}=S.recEdit;const e=emps(true).find(x=>x.id===id);if(!e){S.recEdit=null;return rPanel()}
  const r=rec(id,k);const sch=(e.schedule||{})[fromKey(k).getDay()];
  $("main").innerHTML=`<div class="panel stack"><strong>${esc(fullName(e))}</strong><div class="hint" style="margin:0;text-transform:capitalize">${fmtLong(k)} · ${sch&&sch.on?`Horario ${t12(sch.start)} a ${t12(sch.end)}`:"Día libre"}</div>
    <div class="row"><div><label for="r-in">Entrada</label><input id="r-in" type="time" value="${r&&r.in?hm24(r.in):""}"></div>
    <div><label for="r-out">Salida</label><input id="r-out" type="time" value="${r&&r.out?hm24(r.out):""}"></div></div>
    <p class="hint">Deja la salida vacía si todavía no ha salido. Los registros que guardes aquí quedan marcados como manuales.</p>
    <div class="msg info" id="msg"></div>
    <div class="row"><button class="btn ghost" id="r-cancel">Cancelar</button><button class="btn" id="r-save">Guardar registro</button></div>
    ${r?'<button class="btn danger" id="r-del">Eliminar registro de este día</button>':""}
    ${leaveOf(id,k)?'<button class="btn ghost" id="r-unleave">Quitar permiso de este día</button>':'<button class="btn ghost" id="r-leave">Dar permiso por el día completo</button>'}</div>`;
  const close=()=>{S.recEdit=null;rPanel()};
  if($("r-leave"))$("r-leave").onclick=async()=>{try{await S.db.collection("leaves").doc(newId("p")).set({empId:id,date:k,month:k.slice(0,7),type:"absence",reason:"Registrado por el administrador",status:"approved",createdAt:Date.now(),decidedAt:Date.now()});close()}catch(err){msg("No se pudo guardar el permiso.","bad")}};
  if($("r-unleave"))$("r-unleave").onclick=async()=>{const l=leaveOf(id,k);try{await S.db.collection("leaves").doc(l.id).delete();close()}catch(err){msg("No se pudo quitar el permiso.","bad")}};
  $("r-cancel").onclick=close;
  $("r-save").onclick=async()=>{
    const vi=$("r-in").value,vo=$("r-out").value;
    if(!vi)return msg("La hora de entrada es obligatoria.","bad");
    if(vo&&vo<=vi)return msg("La salida debe ser después de la entrada.","bad");
    const entry={in:tsOf(k,vi),manual:true,editedAt:Date.now()};if(vo)entry.out=tsOf(k,vo);
    if(r){if(r.in&&hm24(r.in)===vi){if(r.inDist!=null)entry.inDist=r.inDist;if(r.inAcc!=null)entry.inAcc=r.inAcc}
      if(r.out&&vo&&hm24(r.out)===vo){if(r.outDist!=null)entry.outDist=r.outDist;if(r.outAcc!=null)entry.outAcc=r.outAcc}}
    const mk=k.slice(0,7);const ref=S.db.doc(`punches/${id}_${mk}`);$("r-save").disabled=true;
    try{const snap=await ref.get();if(!snap.exists)await ref.set({empId:id,month:mk,days:{[k]:entry}});else await ref.update({["days."+k]:entry});close()}
    catch(err){$("r-save").disabled=false;msg(errTxt(err,"No se pudo guardar."),"bad")}
  };
  if(r)$("r-del").onclick=async()=>{if(!confirm(`¿Eliminar el registro de ${fullName(e)} del ${fmtLong(k)}?`))return;
    try{await S.db.doc(`punches/${id}_${k.slice(0,7)}`).update({["days."+k]:firebase.firestore.FieldValue.delete()});close()}
    catch(err){msg("No se pudo eliminar. Revisa que las reglas de Firestore estén actualizadas.","bad")}};
}

  const lvs=Object.entries(S.leaves).filter(([i,l])=>l.status==="pending").map(([i,l])=>({i,l,e:emps(true).find(x=>x.id===l.empId)})).filter(x=>x.e).sort((a,b)=>a.l.date.localeCompare(b.l.date));
  let pend="";

    <div class="panel">${list.length?`<ul class="list">${list.map(e=>{const days=ORDER.filter(i=>e.schedule&&e.schedule[i]&&e.schedule[i].on);
      const s=days.length?days.map(i=>DAYS[i].slice(0,3)+(e.schedule[i].quota?` (${e.schedule[i].quota}/mes)`:"")).join(", ")+` · ${t12(e.schedule[days[0]].start)} – ${t12(e.schedule[days[0]].end)}`:"Sin horario";
      const dv=S.devices[e.id];const dt=!dv?'<span class="pill s-off">Sin celular</span>':dv.approved?`<span class="pill s-ok">Celular aprobado (${esc(dv.model||"")})</span>`:`<span class="pill s-late">Cambio de celular pendiente</span>`;
      return`<li style="flex-wrap:wrap"><div><div class="nm">${esc(fullName(e))}${e.active===false?' <span class="pill s-off">Inactivo</span>':""}</div><div class="sub">${s}</div><div style="margin-top:4px">${dt}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${dv&&dv.approved?`<button class="btn ghost" data-rs="${e.id}">Reiniciar celular</button>`:""}<button class="btn ghost" data-id="${e.id}">Editar</button></div></li>`}).join("")}</ul>`:`<div class="empty">Todavía no hay empleados en esta empresa. Pídeles que se registren desde su celular o agrégalos tú.</div>`}</div>`;
  $("main").innerHTML=pend+(comps().length?compBar():"")+body;

function rEditor(){

  $("main").innerHTML=`<div class="panel stack">
    <strong>${R?"Aprobar registro":e?"Editar empleado":"Nuevo empleado"}</strong>

      <p class="hint">Marca los días que trabaja con su hora de entrada y salida. En "Semanal" debe venir todas las semanas; con "2 al mes" ese día es opcional, pero debe trabajar 2 en el mes o se cuentan como faltas.</p></div>

    ${e?`<div style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-act" style="width:20px;height:20px" ${e.active!==false?"checked":""}><label for="f-act" style="margin:0">Activo (puede marcar)</label></div>`:""}

  const back=()=>{S.editing=null;rEmpleados()};
  {const f=ORDER[0];const rep=$("rep");const show=()=>{rep.style.display="block"};

  const back=()=>{S.compEdit=null;rEmpresas()};
  $("cc").onclick=back;
  $("here").onclick=async()=>{msg("Obteniendo ubicación…","info");try{const p=await getPos();$("a-lat").value=p.coords.latitude.toFixed(6);$("a-lng").value=p.coords.longitude.toFixed(6);msg(`Ubicación tomada (precisión ±${Math.round(p.coords.accuracy)} m). Toca Guardar.`,"ok")}catch(err){msg(geoErr(err),"bad")}};
  $("cs").onclick=async()=>{
    const name=$("a-name").value.trim();if(!name)return msg("Escribe el nombre de la empresa.","bad");
    const lat=parseFloat(String($("a-lat").value).replace(",",".")),lng=parseFloat(String($("a-lng").value).replace(",","."));
    if(isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return msg("Revisa la latitud y la longitud.","bad");
    const obj={id:c?c.id:newId("c"),name,lat,lng,radius:Math.max(20,parseInt($("a-rad").value)||100),tolerance:Math.max(0,parseInt($("a-tol").value)||0)};
    const nc=JSON.parse(JSON.stringify(cfg()));nc.companies=nc.companies||[];nc.employees=nc.employees||[];
    if(c)nc.companies=nc.companies.map(x=>x.id===c.id?obj:x);else nc.companies.push(obj);
    $("cs").disabled=true;
    try{await saveCfg(nc);if(!c)S.company=obj.id;back()}catch(err){$("cs").disabled=false;msg(errTxt(err,"No se pudo guardar."),"bad")}
  };
  if(c)$("cd").onclick=async()=>{
    if(n)return msg(`Esta empresa tiene ${n} empleado${n===1?"":"s"}. Muévelos a otra empresa o elimínalos antes de borrarla.`,"bad");
    if(!confirm(`¿Eliminar ${c.name}?`))return;
    const nc=JSON.parse(JSON.stringify(cfg()));nc.companies=nc.companies.filter(x=>x.id!==c.id);
    try{await saveCfg(nc);back()}catch(err){msg(errTxt(err,"No se pudo eliminar."),"bad")}
  };
}

/* ---------- Inicio ---------- */
render();
try{
  firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore();S.db=db;
  let first=true;
  subMine();
  db.doc("cfg/main").onSnapshot(s=>{S.cfg=norm(s.exists?s.data():null);if(first){first=false;S.ready=true;ensureSub();render()}else refresh()},()=>{S.noDb=true;render()});
  firebase.auth().onAuthStateChanged(u=>{
    const was=S.owner;S.owner=!!u;subAdmin(S.owner);
    if(S.owner&&!was)S.tab="panel";
    if(!S.owner&&S.tab!=="login")S.tab="marcar";
    S.editing=null;S.recEdit=null;S.compEdit=null;S.emode="home";render();
  });
}catch(e){S.noDb=true;render()}
</script>
</body>
